<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Research Assistant</title>
  <style>
    :root { color-scheme: light; --ink: #16202a; --muted: #64717d; --paper: #f5f3ee; --panel: #fffdf9; --line: #d9ddd9; --accent: #c54b32; --accent-dark: #963824; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 85% 10%, #e7eee5 0, transparent 32%), var(--paper); color: var(--ink); font-family: Georgia, 'Times New Roman', serif; }
    main { width: min(900px, calc(100% - 32px)); margin: 0 auto; padding: 72px 0 64px; }
    .eyebrow { margin: 0 0 12px; color: var(--accent); font: 700 12px/1.2 Arial, sans-serif; letter-spacing: 1.8px; text-transform: uppercase; }
    h1 { max-width: 620px; margin: 0; font-size: clamp(42px, 7vw, 76px); line-height: .95; font-weight: 500; letter-spacing: -2px; }
    .intro { max-width: 560px; margin: 24px 0 38px; color: var(--muted); font-size: 20px; line-height: 1.45; }
    form { display: flex; gap: 10px; padding: 8px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 14px 30px #37453b12; }
    textarea { flex: 1; min-height: 58px; resize: vertical; padding: 12px; border: 0; outline: 0; background: transparent; color: var(--ink); font: 18px/1.35 Georgia, serif; }
    button { align-self: stretch; border: 0; padding: 0 22px; background: var(--accent); color: white; cursor: pointer; font: 700 14px Arial, sans-serif; }
    button:hover { background: var(--accent-dark); } button:disabled { opacity: .55; cursor: wait; }
    .status { min-height: 28px; margin: 18px 0; color: var(--muted); font: 14px Arial, sans-serif; }
    .status.error { color: #a52d27; }
    .result { display: none; margin-top: 36px; }
    .result.visible { display: block; animation: rise .35s ease-out; }
    h2 { margin: 0 0 18px; font-size: 27px; font-weight: 500; }
    .answer { font-size: 19px; line-height: 1.65; }
    .answer p { margin: 0 0 18px; }
    .answer a { color: var(--accent-dark); font-weight: 700; text-decoration: underline; text-decoration-thickness: 1px; }
    .sources { margin-top: 42px; padding-top: 22px; border-top: 1px solid var(--line); }
    .sources ol { margin: 0; padding-left: 25px; }
    .sources li { margin: 0 0 12px; padding-left: 6px; font: 15px/1.4 Arial, sans-serif; }
    .sources a { color: var(--ink); } .sources a:hover { color: var(--accent-dark); }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 600px) { main { padding-top: 42px; } form { display: block; } textarea { display: block; width: 100%; } button { width: 100%; min-height: 48px; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Research desk</p>
    <h1>Ask a question. Follow the evidence.</h1>
    <p class="intro">Search the open web, read the original pages, and get a concise answer with sources you can inspect.</p>
    <form id="research-form">
      <textarea id="question" name="question" placeholder="What would you like to understand?" required maxlength="1000"></textarea>
      <button id="submit" type="submit">Research</button>
    </form>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <section id="result" class="result" aria-live="polite">
      <h2>Findings</h2>
      <div id="answer" class="answer"></div>
      <div class="sources"><h2>Sources</h2><ol id="sources-list"></ol></div>
    </section>
  </main>
  <script>
    const form = document.querySelector('#research-form');
    const question = document.querySelector('#question');
    const submit = document.querySelector('#submit');
    const status = document.querySelector('#status');
    const result = document.querySelector('#result');
    const answer = document.querySelector('#answer');
    const sourcesList = document.querySelector('#sources-list');

    function escapeHtml(value) {
      return value.replace(/[&<>'"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character]));
    }

    function renderAnswer(text, sources) {
      const urls = Object.fromEntries(sources.map(source => [source.id, source.url]));
      const linked = escapeHtml(text).replace(/\[(\d+)\]/g, (match, id) => urls[id] ? `<a href="${escapeHtml(urls[id])}" target="_blank" rel="noopener">[${id}]</a>` : match);
      answer.innerHTML = linked.split(/\n\s*\n/).map(paragraph => `<p>${paragraph.replace(/\n/g, '<br>')}</p>`).join('');
      sourcesList.innerHTML = sources.map(source => `<li><a href="${escapeHtml(source.url)}" target="_blank" rel="noopener">${escapeHtml(source.title)}</a></li>`).join('');
      result.classList.add('visible');
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const value = question.value.trim();
      if (!value) return;
      submit.disabled = true;
      status.className = 'status';
      status.textContent = 'Planning searches, reading sources, and composing an answer...';
      result.classList.remove('visible');
      try {
        const response = await fetch('/research', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question: value }) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Research could not be completed.');
        renderAnswer(data.answer, data.sources);
        status.textContent = 'Research complete.';
      } catch (error) {
        status.className = 'status error';
        status.textContent = error.message;
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
